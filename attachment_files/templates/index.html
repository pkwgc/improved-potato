<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>查询中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f9f9f9;
        }
        .nav-link {
            color: #fff !important;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">欢迎，{{ user.username }}</span>
        <span class="navbar-text">余额：{{ user.balance }} 元</span>
    </div>
</nav>

<div class="container my-4">
    <div class="card p-4 shadow-sm">
        <h3 class="mb-3">手机号查询</h3>
        <form action="/query" method="get" class="mb-4">
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="请输入手机号" aria-label="手机号" name="phone" minlength="7" maxlength="15" required>
                <button class="btn btn-primary" type="submit">查询</button>
            </div>
        </form>

        <h4>最近查询记录</h4>
        <ul class="list-group">
            {% for log in logs %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ log.phone }}
                <span class="badge bg-success rounded-pill">{{ log.cost }} 元</span>
                <small>{{ log.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
            </li>
            {% endfor %}
        </ul>
    </div>

    <div class="mt-3 text-center">
        <a href="{{ url_for('history') }}" class="btn btn-outline-primary me-2">查看全部记录</a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">退出登录</a>
    </div>
</div>

<div class="footer">
    &copy; 2025 TeleQuery 查询系统
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
