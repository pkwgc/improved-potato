<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>查询结果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f9f9f9;
        }
        .result-card {
            max-width: 700px;
            margin-top: 60px;
            margin-bottom: 40px;
        }
        .balance-badge {
            background-color: #4e73df;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        pre {
            white-space: pre-wrap; /* 允许换行 */
            word-wrap: break-word;
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container result-card mx-auto">
    <h2 class="text-center mb-4">查询结果</h2>

    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% else %}
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">手机号：{{ phone }}</h5>
            <p class="card-text"><strong>账户余额：</strong><span class="balance-badge">{{ balance }} 元</span></p>
            <hr>
            <h6>查询结果：</h6>
            <pre>{{ result | tojson(indent=2) }}</pre>
        </div>
    </div>
    {% endif %}

    <div class="text-center">
        <a href="{{ url_for('index') }}" class="btn btn-outline-primary">返回首页</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
